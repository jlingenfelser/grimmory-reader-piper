name: Build customized Grimmory + Piper

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout overlay repo
        uses: actions/checkout@v4

      - name: Read pinned Grimmory version
        id: pin
        shell: bash
        run: |
          source config/upstream.env
          echo "ref=$GRIMMORY_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout Grimmory
        uses: actions/checkout@v4
        with:
          repository: grimmory-tools/grimmory
          ref: ${{ steps.pin.outputs.ref }}
          path: upstream

      - name: Apply Piper/TTS overlay
        run: python3 customizations/apply-customizations.py upstream

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Update lockfile and install frontend dependencies
        working-directory: upstream
        run: |
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --ignore-scripts --no-frozen-lockfile

      - name: Install browser Piper runtime assets
        working-directory: upstream
        shell: bash
        run: |
          mkdir -p frontend/public
          for d in onnx piper worker; do
            src="frontend/node_modules/piper-tts-web/dist/$d"
            test -d "$src" || { echo "Missing piper-tts-web runtime asset: $src" >&2; exit 1; }
            rm -rf "frontend/public/$d"
            cp -a "$src" "frontend/public/$d"
          done

      - name: Type-check customized frontend
        working-directory: upstream
        run: pnpm -C frontend run typecheck

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Grimmory image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.pin.outputs.ref }}-tts1

      - name: Build and push customized Grimmory
        uses: docker/build-push-action@v6
        with:
          context: upstream
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.pin.outputs.ref }}-tts1
            APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=grimmory
          cache-to: type=gha,mode=max,scope=grimmory

      - name: Piper image metadata
        id: piper_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-piper
          tags: |
            type=raw,value=latest
            type=raw,value=1.8.0-tts1

      - name: Build and push Piper
        uses: docker/build-push-action@v6
        with:
          context: piper
          push: true
          tags: ${{ steps.piper_meta.outputs.tags }}
          labels: ${{ steps.piper_meta.outputs.labels }}
          build-args: |
            PIPER_VERSION=1.8.0
            PIPER_UID=1000
          cache-from: type=gha,scope=piper
          cache-to: type=gha,mode=max,scope=piper
